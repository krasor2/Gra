<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Seedhand Mobile 0.5.2</title>
<style>
:root{color-scheme:dark;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a16;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;background:#18241e;image-rendering:pixelated;touch-action:none}
.card{background:rgba(11,19,16,.91);border:1px solid rgba(184,228,196,.22);box-shadow:0 5px 22px rgba(0,0,0,.32);backdrop-filter:blur(8px)}
#top{position:fixed;z-index:5;left:calc(8px + var(--sl));right:calc(8px + var(--sr));top:calc(8px + var(--st));display:flex;align-items:center;gap:6px;pointer-events:none}
#brand{padding:8px 10px;border-radius:12px;line-height:1;white-space:nowrap}#brand b{display:block;color:#dcf6e2;font-size:13px}#brand small{display:block;color:#74b68a;font-size:9px;margin-top:4px}
#stats{padding:8px 9px;border-radius:12px;color:#bdd8c5;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

button{font:inherit;color:#e9f6ec;border:1px solid rgba(184,228,196,.23);background:rgba(18,32,25,.95);border-radius:12px;min-width:44px;min-height:44px;padding:0 11px;font-weight:800;touch-action:manipulation}button:active{transform:translateY(1px);background:#294536}button.active{background:#315a42;border-color:#72c78b;color:#fff}
#toolbar{position:fixed;z-index:6;left:calc(8px + var(--sl));right:calc(8px + var(--sr));bottom:calc(8px + var(--sb));display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px;border-radius:16px}
.tool{min-height:58px;padding:4px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.tool i{font-style:normal;font-size:21px;line-height:1}.tool span{font-size:9px}.tool.active{background:#315a42;border-color:#72c78b}
#sheet{position:fixed;z-index:7;left:calc(8px + var(--sl));right:calc(8px + var(--sr));bottom:calc(82px + var(--sb));padding:11px 12px;border-radius:16px;max-height:min(42vh,330px);overflow:auto;transform:translateY(calc(100% + 110px));opacity:0;transition:.2s ease;pointer-events:none}#sheet.open{transform:none;opacity:1;pointer-events:auto}
#sheet h3{font-size:12px;color:#dcf4e2;margin:0 0 8px;padding-right:38px}#sheet .grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;font-size:10px;color:#bdd6c4}#sheet .grid b{color:#effaf1;text-align:right}#close{position:absolute;right:7px;top:7px;min-width:34px;min-height:34px;padding:0}
#toast{position:fixed;z-index:9;left:50%;top:calc(68px + var(--st));transform:translate(-50%,-10px);padding:8px 11px;border-radius:12px;color:#e8f7eb;font-size:10px;opacity:0;transition:.18s;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis}#toast.show{opacity:1;transform:translate(-50%,0)}
#hint{position:fixed;z-index:3;left:50%;bottom:calc(82px + var(--sb));transform:translateX(-50%);font-size:9px;color:rgba(221,244,227,.7);text-shadow:0 1px 3px #000;pointer-events:none;white-space:nowrap}
@media(max-width:520px){#brand small{display:none}#stats{font-size:9px;padding:8px 7px}#actions button{padding:0 8px;min-width:42px}.tool span{font-size:8px}}
@media(max-width:410px){#brand{display:none}#stats{max-width:50vw}}
@media(orientation:landscape) and (max-height:560px){#toolbar{left:auto;width:72px;top:calc(65px + var(--st));bottom:calc(8px + var(--sb));grid-template-columns:1fr;right:calc(8px + var(--sr))}.tool{min-height:48px}#sheet{right:calc(88px + var(--sr));bottom:calc(8px + var(--sb));max-height:45vh}#hint{bottom:calc(10px + var(--sb))}}
@media(prefers-reduced-motion:reduce){#sheet,#toast{transition:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="top"><div id="brand" class="card"><b>SEEDHAND</b><small>MOBILE 0.5.2</small></div><div id="stats" class="card">Ładowanie świata…</div><div id="actions"><button id="ground" title="Wody gruntowe" aria-label="Wody gruntowe">G</button><button id="speed" title="Prędkość" aria-label="Prędkość">1×</button><button id="regen" title="Nowy świat" aria-label="Nowy świat">↻</button><button id="full" title="Pełny ekran" aria-label="Pełny ekran">⛶</button></div></div>
<div id="toolbar" class="card"><button class="tool active" data-tool="observe"><i>☝</i><span>Obserwuj</span></button><button class="tool" data-tool="seed"><i>✦</i><span>Nasiona</span></button><button class="tool" data-tool="water"><i>💧</i><span>Woda</span></button><button class="tool" data-tool="move"><i>✥</i><span>Przenieś</span></button></div>
<div id="sheet" class="card"><button id="close" aria-label="Zamknij">×</button><h3 id="sheetTitle">KAFEL</h3><div id="sheetBody" class="grid"></div></div>
<div id="toast" class="card"></div><div id="hint">Dotknij • przeciągnij mapę • szczypnij, aby przybliżyć</div>
<script>
'use strict';
const C=document.getElementById('game'),X=C.getContext('2d',{alpha:false});
const ui={stats:document.getElementById('stats'),ground:document.getElementById('ground'),speed:document.getElementById('speed'),regen:document.getElementById('regen'),full:document.getElementById('full'),sheet:document.getElementById('sheet'),title:document.getElementById('sheetTitle'),body:document.getElementById('sheetBody'),close:document.getElementById('close'),toast:document.getElementById('toast')};
const W=32,H=24,BASE=30,DIRS=[[1,0],[-1,0],[0,1],[0,-1]],clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const lowPower=(navigator.deviceMemory&&navigator.deviceMemory<=4)||(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4);
let seed=(Date.now()>>>0),tiles=[],tool='observe',overlay=0,speed=1,days=0,heldWater=null,waterCharges=0,heldObject=null,selected=null,toastTimer=0,last=0,acc=0,renderClock=0;
let cam={x:W*BASE/2,y:H*BASE/2,z:1.15},pointers=new Map(),gesture=null;
const buffers={gm:new Float32Array(W*H),gs:new Float32Array(W*H),sm:new Float32Array(W*H),ss:new Float32Array(W*H),dx:new Float32Array(W*H),dy:new Float32Array(W*H)};
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function noise(x,y,k=0){let n=seed^Math.imul(x+97,374761393)^Math.imul(y+193,668265263)^k;n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967295}
function profile(kind){return kind==='sand'?[.9,.9,.24]:kind==='clay'?[.2,.28,.82]:kind==='gravel'?[.96,.96,.12]:kind==='organic'?[.38,.7,.76]:kind==='rock'?[.04,.04,.03]:[.55,.62,.58]}
function names(k){return({sand:'piasek',loam:'glina lekka',clay:'ił',gravel:'żwir',organic:'gleba organiczna',rock:'skała'})[k]}
function tile(x,y){return x>=0&&y>=0&&x<W&&y<H?tiles[y*W+x]:null}
function each(fn){for(let y=0;y<H;y++)for(let x=0;x<W;x++)fn(tile(x,y),x,y)}
function generate(newSeed=true){if(newSeed)seed=(Math.random()*4294967295)>>>0;tiles=[];days=0;heldWater=null;waterCharges=0;heldObject=null;selected=null;ui.sheet.classList.remove('open');const R=rng(seed),lakeX=7+Math.floor(R()*(W-14)),lakeY=6+Math.floor(R()*(H-12));for(let y=0;y<H;y++)for(let x=0;x<W;x++){const n=noise(x,y),n2=noise(x>>1,y>>1,93),e=clamp(Math.floor((n*.55+n2*.45)*4),0,3);let kind=n<.18?'sand':n<.31?'gravel':n<.48?'loam':n<.68?'clay':n<.88?'organic':'rock';const pr=profile(kind);const d=Math.hypot((x-lakeX)*1.08,(y-lakeY)*.92);let terrain='land',depth=0,salt=0;if(d<3.7+noise(x,y,41)*1.2){terrain='fresh';depth=.65+noise(x,y,42)*.35}if(x>W-4+Math.floor(noise(y,0,77)*2)){terrain='salt';depth=.85;salt=.85}const wet=clamp(.16+Math.max(0,1-d/9)*.56+(terrain!=='land'?.55:0)-e*.035);const gw=clamp(.12+Math.max(0,1-d/10)*.68+(W-x<7?.12:0)+noise(x,y,17)*.14);tiles.push({x,y,e,kind,terrain,depth,soil:{m:wet,f:clamp(.3+noise(x,y,12)*.55),r:clamp(.3+noise(x,y,13)*.45),s:salt*.35},gw:{v:gw,s:salt,cond:pr[0],inf:pr[1],cap:pr[2],fx:0,fy:0},grass:null,obj:terrain==='land'&&R()<.055?(R()<.55?'rock':'branch'):null,seep:false})}for(let i=0;i<80;i++)simulate(.2,true);fit();say('Nowy świat: '+seed)}
function fit(){const vw=innerWidth,vh=innerHeight,usableH=vh-(matchMedia('(orientation: portrait)').matches?145:70);cam.z=clamp(Math.min(vw/(W*BASE+80),usableH/(H*BASE+80))*1.35,.48,2.4);cam.x=W*BASE/2;cam.y=H*BASE/2;clampCamera()}
function clampCamera(){const viewW=innerWidth/cam.z,viewH=innerHeight/cam.z,pad=70/cam.z,minX=-pad+viewW/2,maxX=W*BASE+pad-viewW/2,minY=-pad+viewH/2,maxY=H*BASE+pad-viewH/2;cam.x=minX>maxX?W*BASE/2:clamp(cam.x,minX,maxX);cam.y=minY>maxY?H*BASE/2:clamp(cam.y,minY,maxY)}
function simulate(dt,warm=false){const {gm,gs,sm,ss,dx,dy}=buffers;each((t,x,y)=>{const i=y*W+x;gm[i]=t.gw.v;gs[i]=t.gw.s;sm[i]=t.soil.m;ss[i]=t.soil.s;dx[i]=0;dy[i]=0});each((t,x,y)=>{const i=y*W+x;if(t.terrain!=='land'){const target=t.terrain==='fresh'?.76:.9,ex=(target-gm[i])*.012*dt;gm[i]+=ex;gs[i]=lerp(gs[i],t.terrain==='salt'?.82:.02,clamp(Math.abs(ex)*2));}for(const [ox,oy] of DIRS){const nx=x+ox,ny=y+oy,n=tile(nx,ny);if(!n)continue;const a=i,b=ny*W+nx;if(a>b)continue;const headA=gm[a]+t.e*.035,headB=gm[b]+n.e*.035,diff=headA-headB,cond=Math.min(t.gw.cond,n.gw.cond),flow=clamp(diff*cond*.034*dt,-.018,.018);gm[a]-=flow;gm[b]+=flow;const saltMix=flow>0?gs[a]:gs[b];if(flow>0)gs[b]=lerp(gs[b],saltMix,flow*5);else if(flow<0)gs[a]=lerp(gs[a],saltMix,-flow*5);dx[a]-=ox*flow;dy[a]-=oy*flow;dx[b]+=ox*flow;dy[b]+=oy*flow}if(t.terrain==='land'){const recharge=Math.max(0,sm[i]-.66)*t.gw.inf*.045*dt;sm[i]-=recharge;gm[i]+=recharge;const depth=clamp(1-gm[i]+t.e*.045),cap=Math.max(0,1-depth/(.16+t.gw.cap*.55))*t.gw.cap*.025*dt,give=Math.min(cap,Math.max(0,gm[i]-.08));gm[i]-=give;sm[i]+=give;ss[i]=lerp(ss[i],gs[i],give*3)}});each((t,x,y)=>{const i=y*W+x;t.gw.v=clamp(gm[i]);t.gw.s=clamp(gs[i]);t.gw.fx=dx[i]/Math.max(dt,.001);t.gw.fy=dy[i]/Math.max(dt,.001);t.soil.m=clamp(sm[i]);t.soil.s=clamp(ss[i]);if(t.terrain!=='land')return;const grass=t.grass,shade=grass?grass.cover*.22+grass.litter*.18:0,evap=(.0065*(1-shade)+t.e*.0007)*dt;t.soil.m=clamp(t.soil.m-evap);const depth=clamp(1-t.gw.v+t.e*.045);t.seep=depth<.075&&t.gw.v>.79;if(t.seep)t.soil.m=clamp(t.soil.m+.018*dt);if(grass){const moist=clamp(1-Math.abs(t.soil.m-.58)/.5),fert=clamp((t.soil.f-.08)/.55),saltFit=clamp(1-t.soil.s*1.35),oxygen=t.soil.m>.92?clamp(1-(t.soil.m-.92)*8):1,fit=Math.min(moist,fert,saltFit,oxygen),stress=1-fit;grass.stress=lerp(grass.stress,stress,.12);if(grass.seed>.002&&grass.cover<.12&&t.soil.m>.27&&t.soil.m<.88&&t.soil.s<.32){const germ=Math.min(grass.seed,.016*Math.max(.15,fit)*dt);grass.seed-=germ;grass.cover=clamp(grass.cover+germ*.7);grass.roots=clamp(grass.roots+germ*.42)}const growth=Math.max(0,fit-.18)*(.018+grass.roots*.012)*dt;grass.cover=clamp(grass.cover+growth-grass.stress*.006*dt);grass.roots=clamp(grass.roots+growth*.55-grass.stress*.0015*dt);grass.seed=clamp(grass.seed+(grass.cover>.65?grass.cover*.004*dt:0)-grass.seed*.0001*dt);grass.litter=clamp(grass.litter+grass.stress*.004*dt-grass.litter*.002*dt);t.soil.m=clamp(t.soil.m-grass.cover*.0035*dt);t.soil.f=clamp(t.soil.f-grass.cover*.00045*dt+grass.litter*.0008*dt);if(grass.cover<.008&&grass.roots<.02&&grass.seed<.008)t.grass=null;else if(grass.cover>.58&&fit>.52&&noise(x,Math.floor(days),y)>.975){const d=DIRS[Math.floor(noise(x,y,Math.floor(days*7))*4)],n=tile(x+d[0],y+d[1]);if(n&&n.terrain==='land'&&Math.abs(n.e-t.e)<=1){if(!n.grass)n.grass={cover:.002,roots:.002,seed:.025,litter:0,stress:0};else n.grass.seed=clamp(n.grass.seed+.015)}}}else if(noise(x,y,Math.floor(days*3))>.998&&t.soil.m>.36&&t.soil.m<.82&&t.soil.s<.25)t.grass={cover:.002,roots:.002,seed:.03,litter:0,stress:0}});if(!warm)days+=dt}
function worldToScreen(wx,wy){return{x:(wx-cam.x)*cam.z+innerWidth/2,y:(wy-cam.y)*cam.z+innerHeight/2}}
function screenToWorld(sx,sy){return{x:(sx-innerWidth/2)/cam.z+cam.x,y:(sy-innerHeight/2)/cam.z+cam.y}}
function screenTile(sx,sy){const w=screenToWorld(sx,sy),x=Math.floor(w.x/BASE),y=Math.floor(w.y/BASE);return tile(x,y)}
function mix(a,b,t){t=clamp(t);const ar=a>>16&255,ag=a>>8&255,ab=a&255,br=b>>16&255,bg=b>>8&255,bb=b&255;return((lerp(ar,br,t)|0)<<16)|((lerp(ag,bg,t)|0)<<8)|(lerp(ab,bb,t)|0)}
function css(n){return'#'+n.toString(16).padStart(6,'0')}
function render(){const dpr=Math.min(devicePixelRatio||1,lowPower?1.5:2),cw=Math.floor(innerWidth*dpr),ch=Math.floor(innerHeight*dpr);if(C.width!==cw||C.height!==ch){C.width=cw;C.height=ch}X.setTransform(dpr,0,0,dpr,0,0);X.imageSmoothingEnabled=false;X.fillStyle='#17241d';X.fillRect(0,0,innerWidth,innerHeight);const size=BASE*cam.z,bladeScale=lowPower?.72:1;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const t=tile(x,y),p=worldToScreen(x*BASE,y*BASE);if(p.x+size<0||p.y+size<0||p.x>innerWidth||p.y>innerHeight)continue;let col=0x806848;if(t.terrain==='fresh')col=0x2f83a1;else if(t.terrain==='salt')col=0x386e8f;else{col=mix(0xa27c50,0x594c39,t.soil.m*.7);col=mix(col,0x342f2b,t.e*.08);if(t.kind==='sand')col=mix(col,0xc19a63,.38);if(t.kind==='rock')col=mix(col,0x77746c,.52);if(t.soil.s>.35)col=mix(col,0x9c9075,(t.soil.s-.35)*.8)}if(overlay){const depth=clamp(1-t.gw.v+t.e*.045),ov=mix(0x13243e,0x5ee3cf,1-depth);col=mix(col,ov,.68)}X.fillStyle=css(col);X.fillRect(Math.floor(p.x),Math.floor(p.y),Math.ceil(size+1),Math.ceil(size+1));if(t.e&&t.terrain==='land'){X.fillStyle='rgba(255,230,180,'+(t.e*.025)+')';X.fillRect(p.x,p.y,size,Math.max(1,cam.z))}if(t.grass&&t.terrain==='land'){const g=t.grass,healthy=1-g.stress,green=mix(0xa89854,0x3c914c,healthy);X.fillStyle=css(green);const count=Math.floor((3+g.cover*25)*bladeScale);for(let i=0;i<count;i++){const rx=noise(x,y,i*31),ry=noise(x,y,i*67+9),px=p.x+rx*size,py=p.y+ry*size,w=Math.max(1,cam.z*(1+g.cover*1.2));X.fillRect(px,py,w,Math.max(1,cam.z*(1.5+g.cover*3)))}if(g.cover>.55){X.globalAlpha=.22+g.cover*.22;X.fillStyle=css(mix(0x3f7d45,0x62a950,healthy));X.fillRect(p.x,p.y,size,size);X.globalAlpha=1}}if(t.seep){X.fillStyle='rgba(99,223,211,.7)';X.fillRect(p.x+size*.35,p.y+size*.35,size*.3,size*.3)}if(t.obj){X.fillStyle=t.obj==='rock'?'#6e706c':'#8d6035';if(t.obj==='rock'){X.beginPath();X.arc(p.x+size*.52,p.y+size*.55,Math.max(2,size*.16),0,7);X.fill()}else{X.save();X.translate(p.x+size*.5,p.y+size*.55);X.rotate(-.45);X.fillRect(-size*.19,-Math.max(1,size*.045),size*.38,Math.max(2,size*.09));X.restore()}}if(overlay===2&&t.terrain==='land'){const m=Math.hypot(t.gw.fx,t.gw.fy);if(m>.001){const cx=p.x+size/2,cy=p.y+size/2,sc=Math.min(size*.32,m*size*20),a=Math.atan2(t.gw.fy,t.gw.fx);X.strokeStyle='rgba(222,255,250,.68)';X.lineWidth=Math.max(1,cam.z);X.beginPath();X.moveTo(cx,cy);X.lineTo(cx+Math.cos(a)*sc,cy+Math.sin(a)*sc);X.stroke()}}X.strokeStyle='rgba(10,17,14,'+(cam.z>.8?.16:.06)+')';X.lineWidth=1;X.strokeRect(Math.floor(p.x)+.5,Math.floor(p.y)+.5,Math.ceil(size),Math.ceil(size))}if(selected){const p=worldToScreen(selected.x*BASE,selected.y*BASE);X.strokeStyle='#e7f8a9';X.lineWidth=2;X.strokeRect(p.x+2,p.y+2,size-4,size-4)}updateStats();if(selected&&ui.sheet.classList.contains('open'))refreshInspector(selected)}
function updateStats(){let grass=0,seep=0,wet=0;each(t=>{if(t.grass)grass+=t.grass.cover;if(t.seep)seep++;wet+=t.soil.m});const carried=heldWater?' • '+(heldWater==='fresh'?'Słodka':'Słona')+' '+waterCharges+'/3':heldObject?' • '+heldObject:'';ui.stats.textContent='Dzień '+days.toFixed(1)+' • Trawa '+grass.toFixed(0)+' • Wilg. '+Math.round(wet/(W*H)*100)+'% • Źródła '+seep+carried;ui.ground.classList.toggle('active',overlay>0);ui.ground.textContent=overlay===0?'G':overlay===1?'G◉':'G→'}
function say(s,bad=false){ui.toast.textContent=s;ui.toast.style.borderColor=bad?'#bb665f':'';ui.toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>ui.toast.classList.remove('show'),1500);if(navigator.vibrate)navigator.vibrate(bad?35:12)}
function grassState(g){if(!g)return'brak';if(g.cover<.012&&g.seed>.02)return'nasiona w glebie';if(g.stress>.62)return'osłabiona';if(g.cover>.65)return'gęsta darń';if(g.cover>.2)return'rośnie';return'kiełkuje'}
function refreshInspector(t){ui.title.textContent=(t.terrain==='land'?'GLEBA — '+names(t.kind):t.terrain==='fresh'?'SŁODKA WODA':'SŁONA WODA')+' ['+t.x+','+t.y+']';const depth=clamp(1-t.gw.v+t.e*.045),g=t.grass,flow=Math.hypot(t.gw.fx,t.gw.fy);const rows=[['Wysokość',t.e],['Wilgotność',Math.round(t.soil.m*100)+'%'],['Żyzność',Math.round(t.soil.f*100)+'%'],['Odczyn',t.soil.r.toFixed(2)],['Zasolenie',Math.round(t.soil.s*100)+'%'],['Woda gruntowa',Math.round(t.gw.v*100)+'%'],['Głębokość lustra',depth.toFixed(2)],['Przepływ',flow.toFixed(3)],['Podsiąkanie',Math.round(t.gw.cap*100)+'%'],['Wysięk',t.seep?'aktywny':'nie'],['Trawa',grassState(g)],['Pokrycie',g?Math.round(g.cover*100)+'%':'—'],['Korzenie',g?Math.round(g.roots*100)+'%':'—'],['Bank nasion',g?Math.round(g.seed*100)+'%':'—'],['Obiekt',t.obj||'brak']];ui.body.innerHTML=rows.map(r=>'<span>'+r[0]+'</span><b>'+r[1]+'</b>').join('')}
function inspect(t){if(!t)return;selected=t;refreshInspector(t);ui.sheet.classList.add('open')}
function use(t){if(!t)return;if(tool==='observe'){inspect(t);return}if(tool==='seed'){if(t.terrain!=='land'){say('Nasiona wymagają gleby',true);return}if(!t.grass)t.grass={cover:.002,roots:.002,seed:.28,litter:0,stress:0};else t.grass.seed=clamp(t.grass.seed+.25);t.soil.f=clamp(t.soil.f-.01);say(t.soil.m<.27?'Nasiona czekają na wilgoć':'Zasiano trawę');return}if(tool==='water'){if(t.terrain==='fresh'||t.terrain==='salt'){heldWater=t.terrain==='fresh'?'fresh':'salt';waterCharges=3;say(heldWater==='fresh'?'Nabrano słodkiej wody (3)':'Nabrano słonej wody (3)');return}if(!heldWater||waterCharges<=0){heldWater=null;waterCharges=0;say('Najpierw dotknij wody',true);return}t.soil.m=clamp(t.soil.m+.28);if(heldWater==='salt')t.soil.s=clamp(t.soil.s+.16);else t.soil.s=clamp(t.soil.s-.055);waterCharges--;if(waterCharges<=0)heldWater=null;say(waterCharges>0?'Podlano kafel • zostało '+waterCharges:'Podlano kafel');return}if(tool==='move'){if(heldObject){if(t.terrain!=='land'||t.obj){say('To miejsce jest zajęte',true);return}t.obj=heldObject;heldObject=null;say('Przeniesiono obiekt');return}if(!t.obj){say('Dotknij kamienia lub gałęzi',true);return}heldObject=t.obj;t.obj=null;say('Niesiesz: '+heldObject)}}
function setTool(id){tool=id;document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.tool===id));if(id!=='observe')ui.sheet.classList.remove('open');say(({observe:'Obserwacja',seed:'Nasiona trawy',water:'Narzędzie wody',move:'Przenoszenie'})[id])}
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));ui.close.onclick=()=>{ui.sheet.classList.remove('open');selected=null};ui.ground.onclick=()=>{overlay=(overlay+1)%3;say(overlay===0?'Widok powierzchni':overlay===1?'Poziom wód gruntowych':'Przepływ wód gruntowych')};ui.speed.onclick=()=>{speed=speed===1?3:speed===3?0:1;ui.speed.textContent=speed===0?'Ⅱ':speed+'×';say(speed===0?'Pauza':'Prędkość '+speed+'×')};ui.regen.onclick=()=>generate(true);ui.full.onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen?.();else await document.exitFullscreen?.()}catch{say('Pełny ekran niedostępny',true)}};
function beginGesture(){if(pointers.size!==2)return;const a=[...pointers.values()].slice(0,2),cx=(a[0].x+a[1].x)/2,cy=(a[0].y+a[1].y)/2;gesture={dist:Math.max(10,Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)),z:cam.z,world:screenToWorld(cx,cy)}}
C.addEventListener('pointerdown',e=>{C.setPointerCapture?.(e.pointerId);const q={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,sx:e.clientX,sy:e.clientY,time:performance.now(),moved:false};pointers.set(e.pointerId,q);if(pointers.size===2)beginGesture()});
C.addEventListener('pointermove',e=>{const q=pointers.get(e.pointerId);if(!q)return;const nx=e.clientX,ny=e.clientY,dx=nx-q.x,dy=ny-q.y;q.lx=q.x;q.ly=q.y;q.x=nx;q.y=ny;if(Math.hypot(q.x-q.sx,q.y-q.sy)>7)q.moved=true;if(pointers.size>=2){if(!gesture)beginGesture();const a=[...pointers.values()].slice(0,2),cx=(a[0].x+a[1].x)/2,cy=(a[0].y+a[1].y)/2,d=Math.max(10,Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y));cam.z=clamp(gesture.z*d/gesture.dist,.42,3.2);cam.x=gesture.world.x-(cx-innerWidth/2)/cam.z;cam.y=gesture.world.y-(cy-innerHeight/2)/cam.z;clampCamera();return}if(q.moved){cam.x-=dx/cam.z;cam.y-=dy/cam.z;clampCamera()}});
function pointerEnd(e){const q=pointers.get(e.pointerId);if(!q)return;const wasMulti=pointers.size>1;pointers.delete(e.pointerId);if(pointers.size<2){gesture=null;for(const p of pointers.values()){p.lx=p.x;p.ly=p.y;p.sx=p.x;p.sy=p.y;p.moved=true}}if(!wasMulti&&!q.moved&&performance.now()-q.time<500)use(screenTile(e.clientX,e.clientY))}
C.addEventListener('pointerup',pointerEnd);C.addEventListener('pointercancel',pointerEnd);C.addEventListener('contextmenu',e=>e.preventDefault());
C.addEventListener('wheel',e=>{e.preventDefault();const before=screenToWorld(e.clientX,e.clientY),factor=Math.exp(-e.deltaY*.0012);cam.z=clamp(cam.z*factor,.42,3.2);cam.x=before.x-(e.clientX-innerWidth/2)/cam.z;cam.y=before.y-(e.clientY-innerHeight/2)/cam.z;clampCamera()},{passive:false});
window.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='g')ui.ground.click();if(e.key===' '){e.preventDefault();ui.speed.click()}if(e.key.toLowerCase()==='r')generate(true);if(e.key==='Escape'){ui.sheet.classList.remove('open');selected=null}});window.addEventListener('resize',clampCamera);document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('visibilitychange',()=>{last=performance.now()});
function frame(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(speed){acc+=dt*speed;while(acc>.45){simulate(.45);acc-=.45}}renderClock+=dt;const interval=lowPower?1/30:1/60;if(renderClock>=interval){render();renderClock=0}requestAnimationFrame(frame)}
generate(false);requestAnimationFrame(frame);
</script>
</body>
